<div class="dialog-content">
  <div class="dialog-icon" aria-hidden="true">↗</div>
  <div>
    <h2 mat-dialog-title>Log out of PayFlow?</h2>
    <mat-dialog-content>
      Are you sure you want to log out? You will need to sign in again to access your workspace.
    </mat-dialog-content>
  </div>
</div>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close="false">Cancel</button>
  <button mat-flat-button color="primary" type="button" [mat-dialog-close]="true">Log out</button>
</mat-dialog-actions>

spring.application.name=payflow

# Oracle datasource configuration
spring.datasource.url=${PAYFLOW_DB_URL:jdbc:oracle:thin:@localhost:1521:FREEPDB1}
spring.datasource.username=${PAYFLOW_DB_USERNAME:system}
spring.datasource.password=${PAYFLOW_DB_PASSWORD:system}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA and migration configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Security configuration
spring.security.user.name=${PAYFLOW_SECURITY_USERNAME:system}
spring.security.user.password=${PAYFLOW_SECURITY_PASSWORD:system}
spring.security.user.roles=HR_MANAGER

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

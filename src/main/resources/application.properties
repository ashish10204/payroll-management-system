spring.application.name=payflow
spring.profiles.active=${PAYFLOW_PROFILE:oracle}
server.port=${SERVER_PORT:8081}

# Default app behavior
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET:payflow-local-demo-secret-key-change-me-please}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

#---
spring.config.activate.on-profile=local | oracle
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.incubyte.payflow=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
